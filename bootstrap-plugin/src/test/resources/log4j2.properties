# Licensed under MIT (https://github.com/ligoj/bootstrap/blob/master/LICENSE)
# Properties (not JSON/XML) on purpose:
# - JsonConfigurationFactory needs Jackson 2 (com.fasterxml.*), removed by the Jackson 3 migration.
# - XmlConfigurationFactory uses the JDK DOM parser, which triggers a LinkageError when Log4j
#   initializes inside Spring's SimpleThrowawayClassLoader (JPA temp classloader): that child-first
#   loader re-defines org.xml.sax.* from the jrt image (not in OverridingClassLoader's excluded
#   packages), clashing with java.xml's DocumentBuilder signature.
# The properties factory is parsed by Log4j itself with no external dependency.
status = warn
name = Main

property.filename = target/rolling.log

filter.threshold.type = ThresholdFilter
filter.threshold.level = debug

appender.console.type = Console
appender.console.name = STDOUT
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{HH:mm:ss.SSS} [%t] %-5level %logger{36} - %msg%n

appender.rolling.type = RollingFile
appender.rolling.name = RollingFile
appender.rolling.fileName = ${filename}
appender.rolling.filePattern = target/rolling-${sd:type}.%i.log.gz
appender.rolling.layout.type = PatternLayout
appender.rolling.layout.pattern = %d{HH:mm:ss.SSS} [%t] %-5level %logger{36} - %msg%n
appender.rolling.policies.type = Policies
appender.rolling.policies.size.type = SizeBasedTriggeringPolicy
appender.rolling.policies.size.size = 500

logger.filterchain.name = org.springframework.security.web.FilterChainProxy
logger.filterchain.level = info
logger.filterchain.additivity = true
logger.filterchain.appenderRef.stdout.ref = STDOUT

logger.sql.name = org.hibernate.SQL
logger.sql.level = debug
logger.sql.additivity = true
logger.sql.appenderRef.stdout.ref = STDOUT

logger.cxfphase.name = org.apache.cxf.phase.PhaseInterceptorChain
logger.cxfphase.level = error
logger.cxfphase.additivity = true
logger.cxfphase.appenderRef.stdout.ref = STDOUT

logger.hibpersistence.name = org.hibernate.ejb.HibernatePersistence
logger.hibpersistence.level = error
logger.hibpersistence.additivity = true
logger.hibpersistence.appenderRef.stdout.ref = STDOUT

logger.ldapattr.name = org.apache.directory.server.schema.registries.DefaultAttributeTypeRegistry
logger.ldapattr.level = fatal
logger.ldapattr.additivity = true
logger.ldapattr.appenderRef.stdout.ref = STDOUT

logger.ldapdir.name = org.apache.directory.server.core.DefaultDirectoryService
logger.ldapdir.level = error
logger.ldapdir.additivity = true
logger.ldapdir.appenderRef.stdout.ref = STDOUT

logger.ldif.name = org.apache.directory.server.protocol.shared.store.LdifFileLoader
logger.ldif.level = warn
logger.ldif.additivity = true
logger.ldif.appenderRef.stdout.ref = STDOUT

rootLogger.level = info
rootLogger.appenderRef.stdout.ref = STDOUT
