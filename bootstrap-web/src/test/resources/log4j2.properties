# Properties (not JSON/XML) on purpose:
# - JsonConfigurationFactory needs Jackson 2 (com.fasterxml.*), removed by the Jackson 3 migration.
# - XmlConfigurationFactory uses the JDK DOM parser, which triggers a LinkageError when Log4j
#   initializes inside Spring's SimpleThrowawayClassLoader (JPA temp classloader): that child-first
#   loader re-defines org.xml.sax.* from the jrt image (not in OverridingClassLoader's excluded
#   packages), clashing with java.xml's DocumentBuilder signature.
# The properties factory is parsed by Log4j itself with no external dependency.
status = warn
name = Main

property.filename = target/rolling.log

filter.threshold.type = ThresholdFilter
filter.threshold.level = debug

appender.console.type = Console
appender.console.name = STDOUT
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{HH:mm:ss.SSS} [%t] %-5level %logger{36} - %msg%n

appender.rolling.type = RollingFile
appender.rolling.name = RollingFile
appender.rolling.fileName = ${filename}
appender.rolling.filePattern = target/rolling-${sd:type}.%i.log.gz
appender.rolling.layout.type = PatternLayout
appender.rolling.layout.pattern = %d{HH:mm:ss.SSS} [%t] %-5level %logger{36} - %msg%n
appender.rolling.policies.type = Policies
appender.rolling.policies.size.type = SizeBasedTriggeringPolicy
appender.rolling.policies.size.size = 500

logger.security.name = org.springframework.security
logger.security.level = warn
logger.security.additivity = true
logger.security.appenderRef.stdout.ref = STDOUT

logger.jettydesc.name = org.eclipse.jetty.webapp.StandardDescriptorProcessor
logger.jettydesc.level = warn
logger.jettydesc.additivity = true
logger.jettydesc.appenderRef.stdout.ref = STDOUT

rootLogger.level = info
rootLogger.appenderRef.stdout.ref = STDOUT
